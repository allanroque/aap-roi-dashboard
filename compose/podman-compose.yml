# Grafana standalone para o dashboard de ROI do AAP (podman-compose ou docker compose)
# Uso:  cp .env.example .env ; editar ; podman-compose up -d
services:
  grafana:
    image: docker.io/grafana/grafana:13.0.2
    container_name: grafana-aap-roi
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3030/}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    extra_hosts:
      # Necessario SOMENTE se o PostgreSQL do controller roda no MESMO host do Grafana
      # (instalacao containerizada do AAP). Nesse caso use AAP_PG_HOST=host.containers.internal
      - "host.containers.internal:host-gateway"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:Z,ro
      - ../grafana/dashboards:/etc/grafana/dashboards:Z,ro

volumes:
  grafana-data:
