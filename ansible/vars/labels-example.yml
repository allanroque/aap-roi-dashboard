# ---------------------------------------------------------------------
# Taxonomia de labels para o ROI (4 eixos OBRIGATORIOS por template)
#   time:<time dono>      -> usado no custo/minuto (variavel custo_por_time do dashboard)
#   dominio:<tipo>        -> o que a automacao faz (patching, provisioning, compliance...)
#   criticidade:<nivel>   -> alta | media | baixa
#   ambiente:<env>        -> prd | hml | dev
# Regras: minusculo, sem acento, sem espaco, um unico ':'
# ---------------------------------------------------------------------
aap_label_defaults:
  ambiente: dev
  criticidade: media

# Vocabulario fechado (edite para a realidade do ambiente; valores novos entram AQUI primeiro)
aap_vocab:
  time:        [platform, linux, security, cloud, network, database, operacoes]
  dominio:     [provisioning, patching, compliance, deploy, backup, operations, observability,
                self-healing, security, database, network, identity-management, integration]
  criticidade: [alta, media, baixa]
  ambiente:    [prd, hml, dev]

# Templates a rotular. type: job_template | workflow_job_template
aap_templates:
  - name: LINUX-PATCH-RHEL
    organization: LINUX
    type: job_template
    labels: { time: linux, dominio: patching, criticidade: alta, ambiente: prd }
  - name: WF-SECURITY-PATCH-ROLLING
    organization: SECURITY
    type: workflow_job_template
    labels: { time: security, dominio: patching, criticidade: alta, ambiente: prd }
  - name: CLOUD-PROVISION-EC2
    organization: CLOUD
    type: job_template
    labels: { time: cloud, dominio: provisioning }      # criticidade/ambiente vem dos defaults
